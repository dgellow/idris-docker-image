name: Build

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly rebuild from scratch, to pick up base image updates.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NAMESPACE: dgellow
  # Images are pushed to Docker Hub from master only, and only once the
  # DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret are configured.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.DOCKERHUB_USERNAME != '' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [idris, idris2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.image }}/Dockerfile

  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: idris2
            arch: amd64
            runner: ubuntu-24.04
          - image: idris2
            arch: arm64
            runner: ubuntu-24.04-arm
          # GHC 8.8 has no native code generator for arm64.
          - image: idris
            arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from Dockerfile
        id: version
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(grep -m1 -oP '^ARG IDRIS2?_VERSION=v?\K.+' "$IMAGE/Dockerfile")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$NAMESPACE/$IMAGE:v$version-$ARCH" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          load: true
          tags: ${{ steps.version.outputs.ref }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Smoke test
        env:
          IMAGE: ${{ matrix.image }}
          REF: ${{ steps.version.outputs.ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tests/smoke.sh "$IMAGE" "$REF" "$VERSION"

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.version.outputs.ref }}
        run: docker push "$REF"

  publish:
    name: publish (${{ matrix.image }})
    needs: [lint, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: idris2
            archs: amd64 arm64
          - image: idris
            archs: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the multi-arch tags
        env:
          IMAGE: ${{ matrix.image }}
          ARCHS: ${{ matrix.archs }}
        run: |
          version="$(grep -m1 -oP '^ARG IDRIS2?_VERSION=v?\K.+' "$IMAGE/Dockerfile")"
          repo="$NAMESPACE/$IMAGE"
          sources=""
          for arch in $ARCHS; do
            sources="$sources $repo:v$version-$arch"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$repo:v$version" -t "$repo:latest" $sources
